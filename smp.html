<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Email Dispatcher</title>
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 75%);
      color: #f8fafc;
      padding: 20px;
    }

    .form-container {
      width: 100%;
      max-width: 500px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .form-header {
      margin-bottom: 24px;
    }

    .form-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .form-header p {
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group textarea {
      width: 100%;
      height: 180px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      font-family: monospace;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      outline: none;
      resize: vertical;
    }

    .form-group textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #4f46e5;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
      max-height: 150px;
      overflow-y: auto;
      font-family: monospace;
    }

    .status-entry {
      margin-bottom: 4px;
    }
    .status-success { color: #34d399; }
    .status-error { color: #f87171; }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Bulk Email Queue</h2>
      <p>Enter JSON data with target email addresses below.</p>
    </div>

    <form id="form">
      <div class="form-group">
        <label for="json_data">Recipients List (JSON Array)</label>
        <textarea id="json_data" required>[
  { "from_name": "John Doe", "reply_to": "john@example.com" },
  { "from_name": "Jane Smith", "reply_to": "jane@example.com" }
]</textarea>
      </div>

      <input type="submit" id="button" class="submit-btn" value="Start Bulk Sending (7s Interval)">
    </form>

    <div id="status" class="status-box">Ready...</div>
  </div>

  <script type="text/javascript">
    (function() {
      emailjs.init('9GUMgYOTWQIaErIXL');
    })();

    const btn = document.getElementById('button');
    const form = document.getElementById('form');
    const statusBox = document.getElementById('status');

    function logStatus(message, type = '') {
      const entry = document.createElement('div');
      entry.className = `status-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      statusBox.appendChild(entry);
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    // Helper for 7-second delay
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      let recipients = [];
      try {
        recipients = JSON.parse(document.getElementById('json_data').value);
        if (!Array.isArray(recipients)) throw new Error("Input must be a JSON array.");
      } catch (err) {
        alert("Invalid JSON format! Please fix your input.");
        return;
      }

      btn.disabled = true;
      statusBox.innerHTML = '';
      logStatus(`Starting queue for ${recipients.length} recipients...`);

      const serviceID = 'service_9b454e4';
      const templateID = 'template_iocr2w6';

      for (let i = 0; i < recipients.length; i++) {
        const item = recipients[i];
        btn.value = `Sending ${i + 1}/${recipients.length}...`;
        logStatus(`Sending to: ${item.reply_to || 'Unknown recipient'}...`);

        try {
          // Send single template object using emailjs.send
          await emailjs.send(serviceID, templateID, {
            from_name: item.from_name || '',
            reply_to: item.reply_to || ''
          });
          logStatus(`✔ Sent successfully to ${item.reply_to}`, 'status-success');
        } catch (err) {
          logStatus(`✖ Failed for ${item.reply_to}: ${err.text || JSON.stringify(err)}`, 'status-error');
        }

        // Apply 7 second delay before next request (except for last item)
        if (i < recipients.length - 1) {
          logStatus(`Waiting 7 seconds...`);
          await delay(7000);
        }
      }

      btn.value = 'Bulk Sending Complete';
      btn.disabled = false;
      logStatus('--- All tasks processed ---');
    });
  </script>
</body>
</html>
