<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timed EmailJS Bulk Sender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white rounded-xl shadow p-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Bulk Email Sender</h1>
        <p class="text-sm text-gray-500">Queue and send sequential emails via EmailJS with a delay timer</p>
      </div>
      <div class="inline-flex items-center space-x-2 text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-medium">
        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
        <span>EmailJS Ready</span>
      </div>
    </header>

    <form id="emailForm" class="space-y-6">
      <!-- Section 1: Credentials -->
      <section class="bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">1. EmailJS Configuration</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Service ID</label>
            <input type="text" id="serviceId" required placeholder="service_xxx" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Template ID</label>
            <input type="text" id="templateId" required placeholder="template_xxx" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Public Key</label>
            <input type="text" id="publicKey" required placeholder="user_xxx" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
        </div>
      </section>

      <!-- Section 2: Campaign Setup -->
      <section class="bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">2. Campaign Details</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Recipients (comma or new-line separated)</label>
            <textarea id="recipients" rows="3" required placeholder="user1@example.com, user2@example.com&#10;user3@example.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm font-mono"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Delay Between Emails (Seconds)</label>
            <input type="number" id="delayMs" min="1" value="3" required class="w-32 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Message Body / Template Variables</label>
            <textarea id="message" rows="4" required placeholder="Write your email content here..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
          </div>
        </div>
      </section>

      <!-- Controls & Actions -->
      <div class="flex items-center justify-between bg-white rounded-xl shadow p-4">
        <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition">
          Start Sending Batch
        </button>
        <button type="button" id="stopBtn" disabled class="bg-red-50 hover:bg-red-100 text-red-600 font-medium px-6 py-2.5 rounded-lg text-sm transition opacity-50 cursor-not-allowed">
          Cancel Process
        </button>
      </div>
    </form>

    <!-- Section 3: Live Execution Progress -->
    <section class="bg-white rounded-xl shadow p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-semibold text-gray-800">3. Execution Log</h2>
        <span id="counterText" class="text-xs text-gray-500 font-mono">0 / 0 Processed</span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
        <div id="progressBar" class="bg-blue-600 h-3 w-0 transition-all duration-300"></div>
      </div>

      <!-- Console Output Terminal -->
      <div id="logOutput" class="bg-gray-900 text-gray-200 font-mono text-xs p-4 rounded-lg h-48 overflow-y-auto space-y-1">
        <div class="text-gray-500">[System Ready] Fill out inputs and click 'Start Sending Batch'...</div>
      </div>
    </section>
  </div>

  <script>
    let isCancelled = false;
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function appendLog(msg, type = 'info') {
      const log = document.getElementById('logOutput');
      const entry = document.createElement('div');
      const timestamp = new Date().toLocaleTimeString();
      
      let colorClass = 'text-gray-300';
      if (type === 'success') colorClass = 'text-green-400';
      if (type === 'error') colorClass = 'text-red-400';
      if (type === 'warn') colorClass = 'text-yellow-400';

      entry.className = colorClass;
      entry.textContent = `[${timestamp}] ${msg}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const serviceId = document.getElementById('serviceId').value.trim();
      const templateId = document.getElementById('templateId').value.trim();
      const publicKey = document.getElementById('publicKey').value.trim();
      const rawRecipients = document.getElementById('recipients').value;
      const delaySec = parseFloat(document.getElementById('delayMs').value);
      const messageText = document.getElementById('message').value;

      // Parse and clean email addresses
      const emails = rawRecipients
        .split(/[\n,]+/)
        .map(e => e.trim())
        .filter(e => e.length > 0);

      if (emails.length === 0) {
        alert('Please provide at least one recipient email.');
        return;
      }

      // Initialize EmailJS
      emailjs.init(publicKey);

      // UI state updates
      isCancelled = false;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').classList.add('opacity-50');
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('stopBtn').classList.remove('opacity-50', 'cursor-not-allowed');

      const progressBar = document.getElementById('progressBar');
      const counterText = document.getElementById('counterText');
      document.getElementById('logOutput').innerHTML = '';

      appendLog(`Starting sequence for ${emails.length} recipient(s) with ${delaySec}s delay...`);

      for (let i = 0; i < emails.length; i++) {
        if (isCancelled) {
          appendLog('Operation halted by user.', 'warn');
          break;
        }

        const recipient = emails[i];
        appendLog(`Sending to: ${recipient}...`);

        try {
          await emailjs.send(serviceId, templateId, {
            to_email: recipient,
            message: messageText
          });
          appendLog(`✓ Successfully sent to ${recipient}`, 'success');
        } catch (err) {
          appendLog(`✗ Failed to send to ${recipient}: ${err.text || err.message}`, 'error');
        }

        // Update Progress UI
        const percent = Math.round(((i + 1) / emails.length) * 100);
        progressBar.style.width = `${percent}%`;
        counterText.textContent = `${i + 1} / ${emails.length} Processed`;

        // Apply delay between requests (skipping delay on the last email)
        if (i < emails.length - 1 && !isCancelled) {
          appendLog(`Waiting ${delaySec} second(s)...`, 'info');
          await delay(delaySec * 1000);
        }
      }

      appendLog('Batch job completed.', 'info');

      // Reset Controls UI
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').classList.remove('opacity-50');
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('stopBtn').classList.add('opacity-50', 'cursor-not-allowed');
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      isCancelled = true;
      appendLog('Cancel requested. Completing current network request...', 'warn');
    });
  </script>
</body>
</html>
