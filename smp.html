<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 75%);
      color: #f8fafc;
      padding: 20px;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .form-header {
      margin-bottom: 28px;
    }

    .form-header h2 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .form-header p {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #4f46e5;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Join Us</h2>
      <p>Enter your details below to get started.</p>
    </div>

    <form id="form">
      <div class="form-group">
        <label for="from_name">Name</label>
        <input type="text" name="from_name" id="from_name" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label for="reply_to">Email</label>
        <input type="email" name="reply_to" id="reply_to" placeholder="your.email@example.com" required>
      </div>

      <input type="submit" id="button" class="submit-btn" value="Submit">
    </form>
  </div>

  <script type="text/javascript">
    (function() {
      emailjs.init('9GUMgYOTWQIaErIXL');
    })();

    const btn = document.getElementById('button');
    const form = document.getElementById('form');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      btn.value = 'Submitting...';
      btn.disabled = true;

      const serviceID = 'service_9b454e4';
      const templateID = 'template_iocr2w6;

      emailjs.sendForm(serviceID, templateID, this)
        .then(() => {
          btn.value = 'Submit';
          btn.disabled = false;
          alert('Successfully submitted!');
          form.reset();
        }, (err) => {
          btn.value = 'Submit';
          btn.disabled = false;
          alert('Failed to submit: ' + (err.text || JSON.stringify(err)));
        });
    });
  </script>
</body>
</html>
